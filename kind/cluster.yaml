kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: wazuh
nodes:
  - role: control-plane
    extraPortMappings:
      # Wazuh dashboard (NodePort) -> http://localhost:8443
      - containerPort: 30443
        hostPort: 8443
        protocol: TCP
      # Dex (OIDC issuer http://dex.localhost:5556)
      - containerPort: 30556
        hostPort: 5556
        protocol: TCP
