apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webhook-mock
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: git://host.docker.internal:9418/wazuh-kubernetes
    targetRevision: main
    path: manifests/webhook-mock
  destination:
    server: https://kubernetes.default.svc
    namespace: webhook-mock
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
