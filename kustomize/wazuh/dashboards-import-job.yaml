# Imports dashboards/*.ndjson into the Wazuh dashboard through its saved objects API after every sync.
apiVersion: batch/v1
kind: Job
metadata:
  name: wazuh-dashboards-import
  namespace: wazuh
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: wazuh-dashboards-import
    spec:
      restartPolicy: OnFailure
      containers:
        - name: import
          image: python:3.13-alpine
          command: ["python", "-I", "/import/dashboards-import.py"]
          env:
            - name: INDEXER_PASSWORD
              valueFrom: {secretKeyRef: {name: wazuh-indexer-cred, key: INDEXER_PASSWORD}}
          volumeMounts:
            - {name: script, mountPath: /import, readOnly: true}
            - {name: dashboards, mountPath: /dashboards, readOnly: true}
      volumes:
        - name: script
          configMap: {name: wazuh-dashboards-import}
        - name: dashboards
          configMap: {name: wazuh-dashboards}
