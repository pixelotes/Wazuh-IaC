# Stand-in for GitHub: emits audit-log events to Wazuh's syslog listener. The Wazuh github module
# cannot target a custom API URL, so the mock produces what the module would have produced.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: github-mock
resources:
  - deployment.yaml
configMapGenerator:
  - name: github-audit-mock
    files:
      - files/github_audit_mock.py
# Hashed ConfigMap name: editing the script rolls the Deployment
